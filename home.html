<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#14112b" />
<title>Auction Night</title>
<style>
  :root { --bg: #14112b; --card: #221d45; --line: #3a3370; --text: #f5f3ff; --muted: #a59fd6; --gold: #ffc93c; --green: #2ee59d; --blue: #4cc9f0; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #2a2263 0%, var(--bg) 65%); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .wrap { width: 100%; max-width: 760px; text-align: center; }
  .logo { font-size: clamp(44px, 9vw, 84px); font-weight: 900; letter-spacing: -2px; line-height: 1; }
  .logo span { color: var(--gold); }
  .sub { color: var(--muted); margin: 10px 0 34px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  a.tile { display: block; text-decoration: none; color: var(--text); background: var(--card); border: 2px solid var(--line);
    border-radius: 22px; padding: 30px 22px; transition: transform .12s, border-color .12s; }
  a.tile:hover { transform: translateY(-3px); border-color: var(--gold); }
  .icon { font-size: 56px; }
  .t { font-size: 26px; font-weight: 900; margin-top: 8px; }
  .d { color: var(--muted); margin-top: 6px; font-size: 15px; line-height: 1.4; }
  .tv .t { color: var(--blue); } .host .t { color: var(--green); }
  .players { margin-top: 26px; color: var(--muted); font-size: 16px; }
  .players b { color: var(--text); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Auction <span>Night</span></div>
    <div class="sub">Family game night edition</div>
    <div class="grid">
      <a class="tile tv" href="/tv" target="_blank" rel="noopener">
        <div class="icon">📺</div>
        <div class="t">TV screen</div>
        <div class="d">The big screen everyone watches. Shows the QR code, bids, timer and winners.</div>
      </a>
      <a class="tile host" href="/host" target="_blank" rel="noopener">
        <div class="icon">🎛️</div>
        <div class="t">Host controls</div>
        <div class="d">For the host only. Start rounds, raise bids, run timers and manage money.</div>
      </a>
    </div>
    <div class="players"><b>Playing?</b> Scan the QR code on the TV screen with your phone camera.</div>
  </div>
</body>
</html>
