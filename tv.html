<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auction Night — TV</title>
<style>
  :root {
    --bg: #0f0c24; --card: #1d1840; --line: #352e6b; --text: #f5f3ff; --muted: #a59fd6;
    --gold: #ffc93c; --lime: #39ff88; --red: #ff5c7a; --blue: #4cc9f0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at top, #241d55 0%, var(--bg) 60%);
    color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .hidden { display: none !important; }

  #startOverlay { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2vh; background: rgba(10,8,28,.94); cursor: pointer; }
  #startOverlay .big { font-size: 6vh; font-weight: 900; }
  #startOverlay .big span { color: var(--gold); }
  #startOverlay .btn { font-size: 3vh; font-weight: 800; padding: 2vh 4vh; border-radius: 2vh; background: var(--gold); color: #1a1530; }
  #startOverlay .note { color: var(--muted); font-size: 2vh; }

  .app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .bar { height: 9vh; display: flex; align-items: center; justify-content: space-between; padding: 0 3vw; }
  .brand { font-size: 4.2vh; font-weight: 900; letter-spacing: -.05vh; }
  .brand span { color: var(--gold); }
  .barRight { display: flex; align-items: center; gap: 1.5vw; color: var(--muted); font-size: 2.2vh; }
  .miniQr { height: 7vh; width: 7vh; background: white; border-radius: .8vh; padding: .4vh; }
  .miniQr img { width: 100%; height: 100%; display: block; }
  .joinTxt b { color: var(--blue); }
  .mute { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 1vh; padding: .6vh 1vh; font-size: 2vh; cursor: pointer; }

  .body { flex: 1; display: grid; gap: 2.5vw; padding: 0 3vw 3vh; min-height: 0; }
  .panel { background: rgba(29,24,64,.75); border: 1px solid var(--line); border-radius: 2.4vh; padding: 2.5vh; min-height: 0;
    display: flex; flex-direction: column; }
  .panelTitle { font-size: 2vh; letter-spacing: .4vh; text-transform: uppercase; color: var(--muted); margin-bottom: 1.5vh;
    display: flex; justify-content: space-between; }
  .panelTitle b { color: var(--text); }

  /* Lobby */
  .lobby { grid-template-columns: 38% 1fr; }
  .qrBig { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; text-align: center; }
  .qrBig .qrBox { background: white; border-radius: 2vh; padding: 1.5vh; width: min(30vw, 55vh); aspect-ratio: 1; }
  .qrBig img { width: 100%; height: 100%; display: block; }
  .qrBig .scan { font-size: 5vh; font-weight: 900; }
  .qrBig .url { font-size: 2.8vh; color: var(--blue); font-weight: 800; word-break: break-all; }
  .waiting { font-size: 2.4vh; color: var(--muted); animation: pulse 1.8s infinite; }

  /* Auction */
  .auction { grid-template-columns: 58% 1fr; }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.6vh; }
  .roundNo { font-size: 2.2vh; letter-spacing: .5vh; color: var(--muted); text-transform: uppercase; }
  .item { font-size: 5.5vh; font-weight: 900; color: var(--blue); line-height: 1.1; }
  .price { font-size: 20vh; font-weight: 900; color: var(--gold); line-height: .95; text-shadow: 0 .8vh 0 rgba(0,0,0,.35); }
  .price.bump { animation: bump .35s; }
  .banner { font-size: 4vh; font-weight: 900; padding: 1.8vh 3vw; border-radius: 2vh; max-width: 95%; }
  .banner.open { color: var(--lime); border: .4vh dashed var(--lime); animation: pulse 1.4s infinite; }
  .banner.locked { color: #0b2417; background: var(--lime); box-shadow: 0 0 5vh rgba(57,255,136,.6); }
  .banner.frozen { color: white; background: var(--red); animation: shake .5s infinite; }
  .banner.sold { color: #1a1530; background: var(--gold); }
  .banner.idle { color: var(--muted); border: .3vh dashed var(--line); }
  .holding { font-size: 2.8vh; color: var(--muted); }
  .holding b { color: var(--lime); }

  .timer { display: flex; align-items: center; gap: 2vw; }
  .ring { width: 15vh; height: 15vh; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900;
    font-size: 4.5vh; font-variant-numeric: tabular-nums; }
  .timer.warn .txt { color: var(--gold); }
  .timer.frozen .txt { color: var(--red); font-size: 7vh; animation: bump 1s infinite; }

  /* Winner screen (stays up until the host starts the next round) */
  .winStage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.8vh; }
  .winStage .lbl { font-size: 3vh; letter-spacing: .6vh; text-transform: uppercase; color: var(--gold); font-weight: 800; }
  .winStage .trophy { font-size: 12vh; line-height: 1; animation: bump 2s infinite; }
  .winStage .wname { font-size: 13vh; font-weight: 900; color: var(--lime); line-height: 1; text-shadow: 0 0 4vh rgba(57,255,136,.6);
    animation: slam .6s; }
  .winStage .wwhat { font-size: 4vh; font-weight: 800; }
  .winStage .wwhat b { color: var(--gold); }
  .winStage .wleft { font-size: 3vh; color: var(--muted); }
  .winStage .wleft b { color: var(--text); }
  .winStage .next { margin-top: 2vh; font-size: 2.4vh; color: var(--muted); animation: pulse 1.8s infinite; }
  .winStage.nobid .wname { color: var(--red); text-shadow: none; font-size: 10vh; }

  /* Name wall */
  .wall { flex: 1; display: grid; gap: .8vh; align-content: start; min-height: 0; padding: .6vh; }
  .chip { border-radius: 1.2vh; background: #2a2459; border: 1px solid var(--line); display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden; padding: 0 .4vw; transition: background .25s, transform .25s, box-shadow .25s; }
  .chip .n { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .chip .m { color: var(--muted); font-weight: 700; font-size: .72em; }
  .chip.off { opacity: .4; }
  .chip.lead { background: var(--lime); color: #082414; border-color: var(--lime); box-shadow: 0 0 2.5vh rgba(57,255,136,.85);
    transform: scale(1.04); z-index: 2; }
  .chip.lead .m { color: #145a35; }
  .chip.new { animation: pop .6s; }
  .chip.top1 { border-color: var(--gold); }

  /* End */
  .ended { grid-template-columns: 50% 1fr; }
  .podium { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 2vw; padding-bottom: 2vh; }
  .step { text-align: center; width: 28%; }
  .step .who { font-size: 4vh; font-weight: 900; margin-bottom: 1vh; }
  .step .amt { font-size: 3vh; color: var(--lime); font-weight: 800; }
  .step .left { font-size: 2.2vh; color: var(--muted); margin-bottom: 1vh; }
  .step .blk { border-radius: 1.5vh 1.5vh 0 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 2vh;
    font-size: 8vh; font-weight: 900; color: #1a1530; }
  .s1 .blk { height: 38vh; background: var(--gold); } .s2 .blk { height: 28vh; background: #cfd3e6; } .s3 .blk { height: 20vh; background: #e39b5b; }

  /* Overlay for SOLD / LOCK flashes */
  #flash { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; text-align: center; }
  #flash .t1 { font-size: 22vh; font-weight: 900; color: var(--gold); text-shadow: 0 1vh 0 rgba(0,0,0,.4); animation: slam .5s; }
  #flash .t2 { font-size: 7vh; font-weight: 900; }
  #flash .t2 b { color: var(--lime); }
  #flash.show { background: rgba(10,8,28,.88); }
  canvas#confetti { position: fixed; inset: 0; z-index: 21; pointer-events: none; }

  @keyframes pulse { 50% { opacity: .55; } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(.2); opacity: 0; } 70% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-.6vh); } 75% { transform: translateX(.6vh); } }
  @keyframes slam { 0% { transform: scale(3); opacity: 0; } 60% { transform: scale(.92); opacity: 1; } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div id="startOverlay">
  <div class="big">Auction <span>Night</span></div>
  <div class="btn">▶ Click to start TV mode</div>
  <div class="note">Turns on sound and full screen. Press F to toggle full screen, M to mute.</div>
</div>

<div class="app">
  <div class="bar">
    <div class="brand">Auction <span>Night</span></div>
    <div class="barRight">
      <span id="joinMini" class="joinTxt hidden">Scan to join · code <b id="joinUrlMini"></b></span>
      <div class="miniQr hidden" id="miniQr"><img id="qrMini" src="/qr.png" alt="" /></div>
      <button class="mute" id="fsBtn">⛶ Full screen</button>
      <button class="mute" id="muteBtn">🔊</button>
    </div>
  </div>
  <div class="body" id="body"></div>
</div>

<div id="flash" class="hidden"></div>
<canvas id="confetti"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script src="/sfx.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => '$' + Number(n).toLocaleString();
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let state = null, clockOffset = 0, view = '', lastPrice = null, lastBeepSec = null, lastEndsAt = null;
  let knownIds = new Set(), firstState = true, buzzedFor = null;

  // ---- start / fullscreen / mute ----
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  function enterFs() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { try { const r = req.call(el); r && r.catch && r.catch(() => {}); } catch (e) {} }
  }
  function exitFs() {
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex) { try { const r = ex.call(document); r && r.catch && r.catch(() => {}); } catch (e) {} }
  }
  const toggleFs = () => (fsEl() ? exitFs() : enterFs());
  const paintFs = () => { $('fsBtn').textContent = fsEl() ? '✕ Exit full screen' : '⛶ Full screen'; };
  document.addEventListener('fullscreenchange', paintFs);
  document.addEventListener('webkitfullscreenchange', paintFs);
  $('fsBtn').onclick = toggleFs;
  $('startOverlay').onclick = () => {
    SFX.unlock();
    $('startOverlay').classList.add('hidden');
    enterFs();
  };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') toggleFs();
    if (e.key === 'm' || e.key === 'M') toggleMute();
  });
  $('muteBtn').onclick = toggleMute;
  function toggleMute() { SFX.setMuted(!SFX.isMuted()); $('muteBtn').textContent = SFX.isMuted() ? '🔇' : '🔊'; }

  // ---- socket ----
  const socket = io({ auth: { role: 'tv' } });
  socket.on('hostState', (s) => {
    clockOffset = s.serverNow - Date.now();
    const newIds = new Set(s.players.map((p) => p.id));
    const freshIds = firstState ? new Set() : new Set([...newIds].filter((id) => !knownIds.has(id)));
    knownIds = newIds; firstState = false;
    state = s;
    render(freshIds);
  });
  socket.on('fx', (f) => {
    switch (f.type) {
      case 'sold':
        if (f.auto) { setTimeout(() => SFX.play('sold'), 700); }
        else SFX.play('sold');
        flash(`<div class="t1">SOLD!</div><div class="t2"><b>${esc(f.name)}</b> for ${fmt(f.amount)}</div>`, 2400, f.auto ? 700 : 0);
        setTimeout(confetti, f.auto ? 900 : 200);
        break;
      case 'nobids':
        if (buzzedFor !== 'played') SFX.play('buzzer');
        setTimeout(() => SFX.play('nobids'), 600);
        flash(`<div class="t1" style="color:var(--red);font-size:14vh">TIME'S UP</div><div class="t2">No bids this round</div>`, 2000);
        break;
      case 'gameEnd': $('flash').className = 'hidden'; SFX.play('gameEnd'); setTimeout(confetti, 300); break;
      default: SFX.play(f.type);
    }
  });

  // ---- clock / timer loop ----
  const now = () => Date.now() + clockOffset;
  setInterval(tickTimer, 100);
  function tickTimer() {
    if (!state || !state.round) return;
    const r = state.round;
    const live = r.state === 'open' || r.state === 'locked';
    if (r.endsAt !== lastEndsAt) { lastEndsAt = r.endsAt; lastBeepSec = null; buzzedFor = null; }
    const t = $('timer');
    if (!live || !r.endsAt) { if (t) t.classList.add('hidden'); return; }
    const remMs = Math.max(0, r.endsAt - now());
    const remSec = Math.ceil(remMs / 1000);
    const frozen = remMs <= state.freezeMs;

    // countdown beeps 5..1, buzzer at 0
    if (remSec <= 5 && remSec >= 1 && remSec !== lastBeepSec) {
      lastBeepSec = remSec;
      SFX.play(remSec === 1 ? 'finalTick' : 'tick');
    }
    if (remMs === 0 && buzzedFor === null) { buzzedFor = 'played'; SFX.play('buzzer'); }

    if (t) {
      t.classList.remove('hidden');
      t.classList.toggle('frozen', frozen);
      t.classList.toggle('warn', !frozen && remMs <= 30000);
      $('timerTxt').textContent = frozen ? remSec : clock(remSec);
      const total = Math.max(r.timerTotal || 1, remMs);
      const C = 2 * Math.PI * 45;
      const arc = $('arc');
      arc.setAttribute('stroke-dashoffset', String(C * (1 - remMs / total)));
      arc.setAttribute('stroke', frozen ? 'var(--red)' : remMs <= 30000 ? 'var(--gold)' : 'var(--lime)');
    }
    const want = frozen ? 'frozen' : 'normal';
    if (window._frozenView !== want) { window._frozenView = want; renderBanner(); }
  }
  const clock = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const isFrozen = () => {
    const r = state && state.round;
    return r && (r.state === 'open' || r.state === 'locked') && r.endsAt && r.endsAt - now() <= state.freezeMs;
  };

  // ---- render ----
  function render(freshIds = new Set()) {
    const s = state;
    const r = s.round;
    let v = 'lobby';
    if (s.status === 'ended') v = 'ended';
    else if (s.status === 'running') v = 'auction';

    $('joinUrlMini').textContent = s.gameCode;
    const qrSrc = '/qr.png?g=' + s.gameCode;
    if ($('qrMini').getAttribute('src') !== qrSrc) $('qrMini').src = qrSrc;
    $('miniQr').classList.toggle('hidden', v === 'lobby');
    $('joinMini').classList.toggle('hidden', v === 'lobby');

    if (v !== view) { view = v; buildLayout(); }
    if (v === 'lobby') {
      $('qrUrl').textContent = 'Game code: ' + s.gameCode;
      if ($('qrBigImg').getAttribute('src') !== qrSrc) $('qrBigImg').src = qrSrc;
      $('count').textContent = `${s.playerCount} / ${s.maxPlayers}`;
    }
    if (v === 'auction') {
      $('roundNo').textContent = r ? `Round ${r.number}` : `${s.playerCount} players`;
      $('item').textContent = r ? (r.item || '') : '';
      const p = $('price');
      if (r && r.state !== 'cancelled') {
        p.textContent = fmt(r.current);
        if (lastPrice !== null && r.current !== lastPrice) { p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); }
        lastPrice = r.current;
      } else { p.textContent = ''; lastPrice = null; }
      $('count').textContent = `${s.playerCount}`;
      renderBanner();
      renderWinner();
    }
    if (v === 'ended') renderPodium();
    renderWall(freshIds);
  }

  function buildLayout() {
    const b = $('body');
    if (view === 'lobby') {
      b.className = 'body lobby';
      b.innerHTML = `
        <div class="panel"><div class="qrBig">
          <div class="scan">Scan to join!</div>
          <div class="qrBox"><img id="qrBigImg" src="/qr.png?g=${state ? state.gameCode : ''}" alt="QR code" /></div>
          <div class="url" id="qrUrl"></div>
          <div class="waiting">Waiting for the host to start…</div>
        </div></div>
        <div class="panel"><div class="panelTitle"><span>Players</span><b id="count"></b></div><div class="wall" id="wall"></div></div>`;
    } else if (view === 'auction') {
      b.className = 'body auction';
      b.innerHTML = `
        <div class="panel"><div class="winStage hidden" id="winStage"></div><div class="stage" id="liveStage">
          <div class="roundNo" id="roundNo"></div>
          <div class="item" id="item"></div>
          <div class="price" id="price"></div>
          <div id="bannerWrap"></div>
          <div class="timer hidden" id="timer">
            <div class="ring">
              <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" stroke="#2a2459" stroke-width="8" fill="none"/>
              <circle id="arc" cx="50" cy="50" r="45" stroke="var(--lime)" stroke-width="8" fill="none" stroke-linecap="round"
                stroke-dasharray="${2 * Math.PI * 45}" stroke-dashoffset="0"/></svg>
              <div class="txt" id="timerTxt"></div>
            </div>
          </div>
        </div></div>
        <div class="panel"><div class="panelTitle"><span>Players</span><b id="count"></b></div><div class="wall" id="wall"></div></div>`;
    } else {
      b.className = 'body ended';
      b.innerHTML = `
        <div class="panel"><div class="panelTitle"><span>🏆 Most items won</span></div><div class="podium" id="podium"></div></div>
        <div class="panel"><div class="panelTitle"><span>Final standings</span></div><div class="wall" id="wall"></div></div>`;
    }
  }

  function renderBanner() {
    const w = $('bannerWrap'); if (!w || !state) return;
    const r = state.round;
    let html = '';
    if (!r || r.state === 'cancelled') {
      html = `<div class="banner idle">${r && r.endReason === 'nobids' ? "Time's up — no bids. " : ''}Next item coming up…</div>`;
    } else if (r.state === 'sold') {
      html = `<div class="banner sold">🔨 SOLD to ${esc(r.leader.name)} for ${fmt(r.leader.amount)}</div>`;
    } else if (isFrozen()) {
      html = `<div class="banner frozen">⏱ FINAL SECONDS — NO MORE BIDS!</div>` +
        (r.leader ? `<div class="holding"><b>${esc(r.leader.name)}</b> is winning at ${fmt(r.leader.amount)}</div>` : '');
    } else if (r.state === 'locked') {
      html = `<div class="banner locked">🔒 ${esc(r.leader.name)} locked in ${fmt(r.leader.amount)}!</div>`;
    } else {
      html = `<div class="banner open">BIDDING OPEN — TAP BID ON YOUR PHONE!</div>` +
        (r.leader ? `<div class="holding"><b>${esc(r.leader.name)}</b> is holding at ${fmt(r.leader.amount)}</div>` : '');
    }
    w.innerHTML = html;
  }

  function renderWinner() {
    const r = state.round, ws = $('winStage'), live = $('liveStage');
    const show = r && (r.state === 'sold' || (r.state === 'cancelled' && r.endReason === 'nobids'));
    ws.classList.toggle('hidden', !show); live.classList.toggle('hidden', !!show);
    if (!show) { ws.dataset.round = ''; return; }
    const key = r.number + r.state;
    if (ws.dataset.round === key) { // keep animation; just refresh money
      const ml = $('winMoney'); if (ml && r.winnerMoney !== null) ml.textContent = fmt(r.winnerMoney); return;
    }
    ws.dataset.round = key;
    if (r.state === 'sold') {
      ws.className = 'winStage';
      ws.innerHTML = `
        <div class="lbl">Round ${r.number} winner</div>
        <div class="trophy">🏆</div>
        <div class="wname">${esc(r.leader.name)}</div>
        <div class="wwhat">won ${r.item ? `<b>${esc(r.item)}</b>` : 'the round'} for <b>${fmt(r.leader.amount)}</b></div>
        <div class="wleft">Money left: <b id="winMoney">${r.winnerMoney !== null ? fmt(r.winnerMoney) : ''}</b></div>
        <div class="next">Next round starting soon…</div>`;
    } else {
      ws.className = 'winStage nobid';
      ws.innerHTML = `
        <div class="lbl">Round ${r.number}${r.item ? ' · ' + esc(r.item) : ''}</div>
        <div class="wname">No winner</div>
        <div class="wwhat">Nobody bid before time ran out</div>
        <div class="next">Next round starting soon…</div>`;
    }
  }

  function renderWall(freshIds) {
    const wall = $('wall'); if (!wall) return;
    const r = state.round;
    const leadId = view !== 'ended' && r && r.leader && r.state !== 'cancelled' ? r.leader.id : null;
    let list = state.players.slice();
    if (view === 'ended') list = rankPlayers(list);
    else list.sort((a, b) => a.joinedAt - b.joinedAt);
    if (!list.length) { wall.style.gridTemplateColumns = '1fr'; wall.innerHTML = `<div class="waiting" style="text-align:center;margin-top:4vh">No one yet — scan the code!</div>`; return; }

    // Fit every name in the panel
    const W = wall.clientWidth, H = wall.clientHeight, n = list.length, gap = window.innerHeight * 0.008;
    let cols = Math.max(1, Math.ceil(Math.sqrt((n * W) / (H * 2.6))));
    let rows = Math.ceil(n / cols);
    while ((H - gap * (rows - 1)) / rows < 28 && cols < 14) { cols++; rows = Math.ceil(n / cols); }
    const cellH = Math.min((H - gap * (rows - 1)) / rows, window.innerHeight * 0.12);
    const cellW = (W - gap * (cols - 1)) / cols;
    const font = Math.max(10, Math.min(cellH * 0.36, cellW * 0.15));
    wall.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    wall.style.gridAutoRows = `${cellH}px`;
    wall.style.fontSize = `${font}px`;
    wall.innerHTML = list.map((p, i) => `
      <div class="chip ${p.id === leadId ? 'lead' : ''} ${p.connected ? '' : 'off'} ${freshIds.has(p.id) ? 'new' : ''} ${view === 'ended' && i === 0 ? 'top1' : ''}">
        <div class="n">${view === 'ended' ? (i + 1) + '. ' : ''}${esc(p.name)}</div>
        <div class="m">${view === 'ended' ? `${p.wins} won · ` : ''}${fmt(p.money)}</div>
      </div>`).join('');
  }

  // Most items won first; ties go to whoever has more money left
  const rankPlayers = (list) => list.slice().sort((a, b) => b.wins - a.wins || b.money - a.money || a.name.localeCompare(b.name));

  function renderPodium() {
    const top = rankPlayers(state.players).slice(0, 3);
    const order = [[top[1], 's2', 2], [top[0], 's1', 1], [top[2], 's3', 3]];
    $('podium').innerHTML = order.map(([p, cls, place]) => p ? `
      <div class="step ${cls}"><div class="who">${esc(p.name)}</div><div class="amt">${p.wins} ${p.wins === 1 ? 'item' : 'items'} won</div><div class="left">${fmt(p.money)} left</div><div class="blk">${place}</div></div>` : '').join('');
  }

  window.addEventListener('resize', () => state && renderWall(new Set()));

  // ---- flash overlay ----
  let flashT = null;
  function flash(html, ms, delay = 0) {
    setTimeout(() => {
      const f = $('flash'); f.innerHTML = html; f.className = 'show';
      clearTimeout(flashT); flashT = setTimeout(() => (f.className = 'hidden'), ms);
    }, delay);
  }

  // ---- confetti ----
  function confetti() {
    const c = $('confetti'), ctx = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    const colors = ['#ffc93c', '#39ff88', '#4cc9f0', '#ff5c7a', '#ffffff', '#b388ff'];
    const parts = Array.from({ length: 220 }, () => ({
      x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.5, w: 6 + Math.random() * 8, h: 10 + Math.random() * 10,
      vy: 3 + Math.random() * 5, vx: -2 + Math.random() * 4, r: Math.random() * 6, vr: -0.2 + Math.random() * 0.4,
      color: colors[(Math.random() * colors.length) | 0],
    }));
    const end = performance.now() + 4000;
    (function frame(t) {
      ctx.clearRect(0, 0, c.width, c.height);
      parts.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      });
      if (t < end) requestAnimationFrame(frame); else ctx.clearRect(0, 0, c.width, c.height);
    })(performance.now());
  }
</script>
</body>
