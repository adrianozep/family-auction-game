<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#14112b" />
<title>Auction Night — Play</title>
<style>
  :root {
    --bg: #14112b; --card: #221d45; --line: #3a3370; --text: #f5f3ff; --muted: #a59fd6;
    --gold: #ffc93c; --green: #2ee59d; --red: #ff5c7a; --blue: #4cc9f0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100dvh; }
  .hidden { display: none !important; }

  /* Join */
  #join { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px; gap: 18px; }
  .logo { font-size: 44px; font-weight: 900; line-height: 1; letter-spacing: -1px; }
  .logo span { color: var(--gold); }
  .sub { color: var(--muted); margin-top: -8px; }
  input { width: 100%; font-size: 24px; padding: 16px 18px; border-radius: 14px; border: 2px solid var(--line);
    background: var(--card); color: var(--text); outline: none; text-align: center; font-weight: 700; }
  input:focus { border-color: var(--gold); }
  .count { text-align: right; color: var(--muted); font-size: 13px; margin-top: -10px; }
  .btn { width: 100%; font-size: 22px; font-weight: 800; padding: 18px; border-radius: 16px; border: 0;
    background: var(--gold); color: #1a1530; cursor: pointer; }
  .btn:disabled { opacity: .45; }
  .err { color: var(--red); min-height: 22px; text-align: center; font-weight: 600; }

  /* Game */
  #game { flex: 1; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px;
    background: var(--card); border-bottom: 1px solid var(--line); }
  .nick { font-weight: 800; font-size: 18px; }
  .leave { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; }
  .wallet { text-align: center; padding: 18px 10px 8px; }
  .wallet .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 2px; }
  .wallet .money { font-size: 52px; font-weight: 900; color: var(--green); transition: transform .2s; }
  .wallet .money.bump { transform: scale(1.12); }

  #stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 16px 20px 28px; text-align: center; gap: 14px; }
  .msg { font-size: 22px; font-weight: 700; }
  .muted { color: var(--muted); }
  .item { font-size: 18px; color: var(--blue); font-weight: 700; }
  .price-label { color: var(--muted); text-transform: uppercase; letter-spacing: 2px; font-size: 13px; }
  .price { font-size: 76px; font-weight: 900; color: var(--gold); line-height: 1; }
  .bid { width: 100%; max-width: 420px; aspect-ratio: 1.6; border-radius: 26px; border: 0; font-size: 34px;
    font-weight: 900; color: #10241b; background: var(--green); box-shadow: 0 10px 0 #18a56f; cursor: pointer;
    transition: transform .05s; }
  .bid:active { transform: translateY(6px); box-shadow: 0 4px 0 #18a56f; }
  .bid:disabled { background: #3d3a5c; color: #8c88b5; box-shadow: 0 10px 0 #2a2746; }
  .banner { width: 100%; max-width: 420px; padding: 18px; border-radius: 18px; font-size: 20px; font-weight: 800; }
  .banner.lock { background: rgba(255,92,122,.15); border: 2px solid var(--red); }
  .banner.win { background: rgba(46,229,157,.15); border: 2px solid var(--green); }
  .banner.sold { background: rgba(255,201,60,.15); border: 2px solid var(--gold); }
  .pulse { animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .standings { width: 100%; max-width: 420px; text-align: left; }
  .standings div { display: flex; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .standings .mine { background: rgba(255,201,60,.15); border-radius: 10px; font-weight: 800; }
  .ptimer { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; padding: 6px 16px; border-radius: 12px; background: var(--card); }
  .ptimer.warn { color: var(--gold); } .ptimer.frozen { color: white; background: var(--red); }
  .banner.frozen { background: rgba(255,92,122,.25); border: 2px solid var(--red); }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #000c; padding: 12px 18px;
    border-radius: 12px; font-weight: 700; max-width: 90%; text-align: center; transition: opacity .3s; }
  #conn { position: fixed; top: 0; left: 0; right: 0; background: var(--red); color: white; text-align: center;
    font-size: 13px; padding: 4px; font-weight: 700; }
</style>
</head>
<body>
  <div id="conn" class="hidden">Reconnecting…</div>

  <section id="join">
    <div class="logo">Auction<br><span>Night</span></div>
    <div class="sub">Family game night edition</div>
    <input id="nameInput" maxlength="10" placeholder="Nickname" autocomplete="off" autocapitalize="words" />
    <div class="count"><span id="nameCount">0</span>/10</div>
    <button class="btn" id="joinBtn">Join game</button>
    <div class="err" id="joinErr"></div>
  </section>

  <section id="game" class="hidden">
    <header>
      <div class="nick" id="nick"></div>
      <button class="leave" id="leaveBtn">Leave</button>
    </header>
    <div class="wallet">
      <div class="label">Your money</div>
      <div class="money" id="money">$0</div>
    </div>
    <div id="stage"></div>
  </section>

  <div id="toast" class="hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => '$' + Number(n).toLocaleString();
  const TOKEN_KEY = 'auctionNightToken';
  let token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}

  let me = null, state = null, bidding = false;
  const socket = io({ auth: { role: 'player' } });

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 2200);
  }
  function saveToken(t) { token = t; try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function showJoin(msg) {
    me = null; $('game').classList.add('hidden'); $('join').classList.remove('hidden');
    $('joinErr').textContent = msg || '';
  }

  socket.on('connect', () => {
    $('conn').classList.add('hidden');
    if (token) {
      socket.emit('join', { token }, (res) => {
        if (!res.ok) { saveToken(null); showJoin(); }
      });
    }
  });
  socket.on('disconnect', () => $('conn').classList.remove('hidden'));

  // Nicknames: max 10 characters. Letters (including accents like é, ñ), numbers, spaces, and - ' . only.
  const NAME_MAX = 10;
  const cleanNick = (v) => Array.from(v.replace(/[^\p{L}\p{M}\p{N} .'\-]/gu, '').replace(/\s{2,}/g, ' ')).slice(0, NAME_MAX).join('');
  $('nameInput').addEventListener('input', (e) => {
    const inp = e.target, before = inp.value, after = cleanNick(before);
    if (after !== before) {
      inp.value = after;
      $('joinErr').textContent = Array.from(before).length > NAME_MAX && after.length >= NAME_MAX ? '10 characters max' : 'Only letters, numbers and spaces';
    } else $('joinErr').textContent = '';
    const n = Array.from(inp.value).length;
    $('nameCount').textContent = n;
    $('nameCount').parentElement.style.color = n >= NAME_MAX ? 'var(--gold)' : '';
  });
  $('nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });
  $('joinBtn').addEventListener('click', join);
  function join() {
    const name = cleanNick($('nameInput').value).trim();
    if (!name) return ($('joinErr').textContent = 'Pick a nickname');
    $('joinBtn').disabled = true;
    const code = new URLSearchParams(location.search).get('g') || '';
    socket.emit('join', { name, code }, (res) => {
      $('joinBtn').disabled = false;
      if (!res.ok) return ($('joinErr').textContent = res.error);
      saveToken(res.token);
    });
  }
  $('leaveBtn').addEventListener('click', () => {
    if (!confirm('Leave the game? Your money will be lost.')) return;
    socket.emit('leave'); saveToken(null); showJoin();
  });

  socket.on('kicked', (msg) => { saveToken(null); showJoin(msg); });

  socket.on('me', (data) => {
    const prev = me ? me.money : null;
    me = data;
    $('join').classList.add('hidden'); $('game').classList.remove('hidden');
    $('nick').textContent = me.name;
    $('money').textContent = fmt(me.money);
    if (prev !== null && prev !== me.money) {
      $('money').classList.add('bump'); setTimeout(() => $('money').classList.remove('bump'), 220);
    }
    render();
  });
  let clockOffset = 0, frozenNow = false, lastBuzz = null;
  const remaining = () => {
    const r = state && state.round;
    if (!r || !r.endsAt || !(r.state === 'open' || r.state === 'locked')) return null;
    return Math.max(0, r.endsAt - (Date.now() + clockOffset));
  };
  setInterval(() => {
    const rem = remaining();
    const el = document.getElementById('ptimer');
    if (rem === null) { frozenNow = false; return; }
    const sec = Math.ceil(rem / 1000);
    const frozen = rem <= state.freezeMs;
    if (el) {
      el.textContent = `⏱ ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
      el.className = 'ptimer ' + (frozen ? 'frozen' : rem <= 30000 ? 'warn' : '');
    }
    if (frozen && sec >= 1 && sec !== lastBuzz) { lastBuzz = sec; navigator.vibrate && navigator.vibrate(70); }
    if (frozen !== frozenNow) { frozenNow = frozen; render(); }
  }, 200);

  socket.on('state', (s) => {
    clockOffset = s.serverNow - Date.now();
    const wasLockedByMe = state && state.round && state.round.leader && me && state.round.leader.id === me.id;
    state = s; render();
    const r = s.round;
    if (r && r.state === 'locked' && navigator.vibrate) navigator.vibrate(r.leader && me && r.leader.id === me.id ? [80, 40, 80] : 60);
  });

  function render() {
    if (!me || !state) return;
    const st = $('stage');
    const r = state.round;

    if (state.status === 'lobby') {
      st.innerHTML = `<div class="msg">You're in! 🎉</div><div class="muted pulse">Waiting for the host to start the game…</div>`;
      return;
    }
    if (state.status === 'ended') {
      const medal = ['🥇', '🥈', '🥉'];
      const rows = (state.standings || []).map((p, i) =>
        `<div class="${p.name === me.name ? 'mine' : ''}"><span>${medal[i] || (i + 1) + '.'} ${esc(p.name)}</span><span>${p.wins} won · ${fmt(p.money)}</span></div>`).join('');
      st.innerHTML = `<div class="msg">🏁 Game over!</div><div class="standings">${rows}</div>`;
      return;
    }
    if (r && r.state === 'cancelled' && r.endReason === 'nobids') {
      st.innerHTML = `<div class="msg">⏱ Time's up!</div><div class="muted">No one bid this round. Get ready for the next one…</div>`;
      return;
    }
    if (!r || r.state === 'cancelled') {
      st.innerHTML = `<div class="msg">Get ready…</div><div class="muted pulse">The next item is coming up</div>`;
      return;
    }
    const item = r.item ? `<div class="item">${esc(r.item)}</div>` : '';
    const iLead = r.leader && r.leader.id === me.id;

    if (r.state === 'sold') {
      st.innerHTML = iLead
        ? `${item}<div class="banner win">🏆 YOU WON!<br>Paid ${fmt(r.leader.amount)}</div>`
        : `${item}<div class="banner sold">SOLD to ${esc(r.leader.name)}<br>for ${fmt(r.leader.amount)}</div>`;
      return;
    }

    let lower = '';
    const rem = remaining();
    const frozen = rem !== null && rem <= state.freezeMs;
    if (frozen) {
      lower = iLead
        ? `<div class="banner win">⏱ Final seconds! You're winning at ${fmt(r.leader.amount)} 🤞</div>`
        : `<div class="banner frozen">⏱ Final seconds: bidding is closed${r.leader ? `<br><span class="muted">${esc(r.leader.name)} is winning at ${fmt(r.leader.amount)}</span>` : ''}</div>`;
    } else if (r.state === 'locked') {
      lower = iLead
        ? `<div class="banner win">🔒 You locked in ${fmt(r.leader.amount)}!<br><span class="muted">Waiting for the host…</span></div>`
        : `<div class="banner lock">🔒 ${esc(r.leader.name)} locked in ${fmt(r.leader.amount)}<br><span class="muted">Wait for the host to raise the bid</span></div>`;
    } else if (iLead) {
      lower = `<div class="banner win">You're winning at ${fmt(r.leader.amount)} ✋<br><span class="muted">Someone has to beat ${fmt(r.current)}</span></div>`;
    } else if (me.money < r.current) {
      lower = `<button class="bid" disabled>Not enough money</button>`;
    } else {
      lower = `<button class="bid" id="bidBtn">BID ${fmt(r.current)}</button>
        ${r.leader ? `<div class="muted">${esc(r.leader.name)} is holding at ${fmt(r.leader.amount)}</div>` : ''}`;
    }
    const timerHtml = rem !== null ? `<div class="ptimer" id="ptimer"></div>` : '';
    st.innerHTML = `${timerHtml}${item}<div class="price-label">Current bid</div><div class="price">${fmt(r.current)}</div>${lower}`;
    const b = $('bidBtn');
    if (b) b.addEventListener('click', () => placeBid(r.current, b));
  }

  function placeBid(amount, btn) {
    if (bidding) return;
    bidding = true; btn.disabled = true; btn.textContent = 'Locking in…';
    socket.emit('bid', { amount }, (res) => {
      bidding = false;
      if (!res.ok) { toast(res.error); render(); }
    });
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
</script>
</body>
</html>
